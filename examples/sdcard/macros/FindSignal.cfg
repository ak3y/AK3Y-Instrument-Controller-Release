[macro]
name=Find Signal
description=Find the strongest signal within a specified frequency range

[parameter:start]
type=number
label=Start Frequency
quantity=frequency
base_unit=Hz
default=1MHz

[parameter:stop]
type=number
label=Stop Frequency
quantity=frequency
base_unit=Hz
default=200MHz

[parameter:span]
type=number
label=Final Span
quantity=frequency
base_unit=Hz
default=100kHz

[result:PeakFrequency]
label=Peak Frequency
source=PeakFreq
unit=Hz

[result:PeakAmplitude]
label=Peak Amplitude
source=PeakLevel
unit=dBm

[steps]
1=ACTION SPECTRUM preset
2=DELAY 2000
3=SET SPECTRUM start_frequency {start}
4=SET SPECTRUM stop_frequency {stop}
5=DELAY 2000

6=ACTION SPECTRUM peak_search
7=DELAY 2000
8=ACTION SPECTRUM marker_to_center
9=DELAY 2000

10=SET SPECTRUM span 2000000
11=DELAY 2000
12=ACTION SPECTRUM peak_search
13=DELAY 2000
14=ACTION SPECTRUM marker_to_center
15=DELAY 2000

16=SET SPECTRUM span {span}
17=DELAY 2000
18=ACTION SPECTRUM peak_search
19=DELAY 2000
20=ACTION SPECTRUM marker_to_center
21=DELAY 2000
22=ACTION SPECTRUM peak_search
23=QUERY SPECTRUM marker_frequency AS PeakFreq
24=QUERY SPECTRUM marker_amplitude AS PeakLevel
