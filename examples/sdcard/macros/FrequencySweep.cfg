[macro]
description=Sweep the Marconi 2024 and measure each point with the E4407B

[parameter:start_frequency]
type=number
quantity=frequency
label=Start Frequency
base_unit=Hz
default=147MHz

[parameter:stop_frequency]
type=number
quantity=frequency
label=Stop Frequency
base_unit=Hz
default=149MHz

[parameter:increment]
type=number
quantity=frequency
label=Frequency Increment
base_unit=Hz
default=100kHz

[steps]
1=SWEEP Freq_IN {start_frequency} {stop_frequency} {increment}
2=SET RFGEN frequency {Freq_IN}
3=WAIT RFGEN ready
4=ACTION SPECTRUM single_sweep
5=WAIT SPECTRUM ready
6=ACTION SPECTRUM peak_search
7=QUERY SPECTRUM marker_frequency AS Freq_Measured
8=QUERY SPECTRUM marker_amplitude AS Power_Measured
9=LOG /logs/frequency_sweep.csv Freq_IN,Freq_Measured,Power_Measured
10=ENDSWEEP
11=ACTION SPECTRUM continuous_sweep