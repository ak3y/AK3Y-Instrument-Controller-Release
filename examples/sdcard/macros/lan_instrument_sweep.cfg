[macro]
name=LAN Instrument Sweep
description=Exercise the complete TCP/LAN semantic macro path with synchronized frequency stepping and CSV logging

[parameter:start_frequency]
type=number
label=Start Frequency
quantity=frequency
base_unit=Hz
default=144MHz

[parameter:stop_frequency]
type=number
label=Stop Frequency
quantity=frequency
base_unit=Hz
default=148MHz

[parameter:increment]
type=number
label=Frequency Increment
quantity=frequency
base_unit=Hz
default=1MHz

[parameter:level]
type=number
label=RF Level
quantity=power_level
base_unit=dBm
default=-47

[steps]
1=SET LANSIM level {level}
2=WAIT LANSIM ready
3=SET LANSIM output ON
4=WAIT LANSIM ready
5=SWEEP Freq_IN {start_frequency} {stop_frequency} {increment}
6=SET LANSIM frequency {Freq_IN}
7=WAIT LANSIM ready
8=QUERY LANSIM frequency AS Freq_Measured
9=QUERY LANSIM level AS Level_Measured
10=LOG /logs/lan_sweep.csv Freq_IN,Freq_Measured,Level_Measured
11=ENDSWEEP
12=SET LANSIM output OFF
13=WAIT LANSIM ready
14=QUERY LANSIM output AS Output_Final
