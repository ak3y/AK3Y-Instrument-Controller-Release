[instrument]
manufacturer=Agilent Technologies
model=E4407B
description=ESA-E Series Spectrum Analyzer
ready_query=*OPC?
ready_response=+1
ready_timeout_ms=30000

[identity]
type=text
label=Identification
query=*IDN?

[start_frequency]
type=number
quantity=frequency
label=Start Frequency
base_unit=Hz
set=:FREQ:STAR {value}HZ
query=:FREQ:STAR?
minimum=0
maximum=26500000000

[stop_frequency]
type=number
quantity=frequency
label=Stop Frequency
base_unit=Hz
set=:FREQ:STOP {value}HZ
query=:FREQ:STOP?
minimum=0
maximum=26500000000

[reference_level]
type=number
quantity=power_level
label=Reference Level
base_unit=dBm
set=:DISP:WIND:TRAC:Y:RLEV {value}DBM
query=:DISP:WIND:TRAC:Y:RLEV?
minimum=-149.9
maximum=55

[attenuation_mode]
type=select
label=Attenuation
set=:POW:RF:ATT:AUTO {value}
query=:POW:RF:ATT:AUTO?
options=Auto:1,Manual:0

[attenuation]
type=number
quantity=attenuation
label=Attenuation
base_unit=dB
set=:POW:RF:ATT {value}DB
query=:POW:RF:ATT?
minimum=0
maximum=65
visible_when=attenuation_mode:0

[scale_div]
type=number
quantity=amplitude_scale
label=Scale/Div
base_unit=dB
set=:DISP:WIND:TRAC:Y:PDIV {value}DB
query=:DISP:WIND:TRAC:Y:PDIV?
minimum=0.1
maximum=20

[resolution_bw_mode]
type=select
label=Resolution BW
set=:BAND:AUTO {value}
query=:BAND:AUTO?
options=Auto:1,Manual:0

[resolution_bw]
type=number
quantity=frequency
label=Resolution BW
base_unit=Hz
set=:BAND {value}HZ
query=:BAND?
minimum=1
maximum=5000000
visible_when=resolution_bw_mode:0

[video_bw_mode]
type=select
label=Video BW
set=:BAND:VID:AUTO {value}
query=:BAND:VID:AUTO?
options=Auto:1,Manual:0

[video_bw]
type=number
quantity=frequency
label=Video BW
base_unit=Hz
set=:BAND:VID {value}HZ
query=:BAND:VID?
minimum=1
maximum=3000000
visible_when=video_bw_mode:0

[average]
type=select
label=Averaging
set=:AVER {value}
query=:AVER?
options=Off:0,On:1

[average_count]
type=number
quantity=count
label=Average Count
base_unit=count
set=:AVER:COUN {value}
query=:AVER:COUN?
minimum=1
maximum=8192
visible_when=average:1

[preset]
type=action
label=Preset
action=:SYST:PRESet

[peak_search]
type=action
label=Peak Search
action=:CALC:MARK1:MAX

[marker_frequency]
type=number
quantity=frequency
label=Marker Frequency
base_unit=Hz
query=:CALC:MARK1:X?

[marker_amplitude]
type=number
quantity=power_level
label=Marker Amplitude
base_unit=dBm
query=:CALC:MARK1:Y?

[span]
type=number
quantity=frequency
label=Span
base_unit=Hz
set=:FREQ:SPAN {value}HZ
query=:FREQ:SPAN?
minimum=100
maximum=27000000000

[signal_track]
type=select
label=Signal Track
set=:CALC:MARK1:TRCK {value}
query=:CALC:MARK1:TRCK?
options=Off:0,On:1

[marker_to_center]
type=action
label=Marker -> Center
action=:CALC:MARK1:CENT

[single_sweep]
type=action
label=Single Sweep
action=:INIT:CONT 0;:INIT:IMM
ui=false

[continuous_sweep]
type=action
label=Continuous Sweep
action=:INIT:CONT 1
ui=false

