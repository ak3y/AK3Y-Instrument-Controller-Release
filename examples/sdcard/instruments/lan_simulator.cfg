[instrument]
manufacturer=AK3Y
model=LAN-SIM
description=ESP32 LAN Instrument Simulator
default_function=Basic Controls
tcp_command_terminator=LF
tcp_response_terminator=LF
ready_query=*OPC?
ready_response=1
ready_timeout_ms=3000

[identity]
query=*IDN?

[frequency]
type=number
quantity=frequency
label=Frequency
base_unit=Hz
set=FREQ {value}
query=FREQ?
response_prefix=FREQ:VALUE
response_terminator=;
minimum=1
maximum=6000000000

[level]
type=number
quantity=power_level
label=RF Level
base_unit=dBm
set=POW {value}
query=POW?
response_prefix=POW:VALUE
response_terminator=;
minimum=-140
maximum=20

[output]
type=select
label=RF Output
set=OUTP {value}
query=OUTP?
response_prefix=OUTP:VALUE
response_terminator=;
options=Off:OFF,On:ON

[no_response]
query=NORESPONSE?

[long_operation]
type=action
label=Long Operation Test
action=LONGOP
ui=false

[bad_frequency]
type=number
quantity=frequency
label=Malformed Frequency Test
base_unit=Hz
query=BADFREQ?
response_prefix=FREQ:VALUE
response_terminator=;
ui=false
