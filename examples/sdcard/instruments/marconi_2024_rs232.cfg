[instrument]
manufacturer=Marconi
model=2024
description=RF Signal Generator - RS232
default_function=Basic RF Generator
default_enter=CFRQ:MODE FIXED
serial_command_terminator=LF
serial_response_terminator=LF
ready_query=*OPC?
ready_response=1
ready_timeout_ms=30000

[frequency]
type=number
quantity=frequency
label=Frequency
base_unit=Hz
set=CFRQ:VALUE {value}
query=CFRQ?
response_prefix=:CFRQ:VALUE
response_terminator=;
minimum=9000
maximum=2400000000

[level]
type=number
quantity=power_level
label=RF Level
base_unit=dBm
set=RFLV:VALUE {value}DBM
query=RFLV?
response_prefix=;VALUE 
response_terminator=;
minimum=-140
maximum=13

[sweep]
type=group
label=Carrier Frequency Sweep
enter=CFRQ:MODE SWEPT
members=sweep_start,sweep_stop,sweep_step,sweep_log_step,sweep_time,sweep_mode,sweep_type,sweep_trigger,sweep_start_action,sweep_reset_action

[frequency_mode]
type=select
ui=false
label=Frequency Mode
set=CFRQ:MODE {value}
query=CFRQ?
response_prefix=;MODE
response_terminator=;
options=Fixed:FIXED,Swept:SWEPT

[sweep_start]
type=number
quantity=frequency
label=Start Frequency
base_unit=Hz
set=SWEEP:CFRQ:START {value}
query=SWEEP:CFRQ?
response_prefix=:SWEEP:CFRQ:START
response_terminator=;
minimum=9000
maximum=2400000000

[sweep_stop]
type=number
quantity=frequency
label=Stop Frequency
base_unit=Hz
set=SWEEP:CFRQ:STOP {value}
query=SWEEP:CFRQ?
response_prefix=;STOP
response_terminator=;
minimum=9000
maximum=2400000000

[sweep_step]
type=number
quantity=frequency
label=Step Size
base_unit=Hz
set=SWEEP:CFRQ:INC {value}
query=SWEEP:CFRQ?
response_prefix=;INC
response_terminator=;
minimum=1
maximum=2400000000
visible_when=sweep_type:LIN

[sweep_log_step]
type=number
quantity=percent
label=Log Step
base_unit=%
set=SWEEP:CFRQ:LOGINC {value}
query=SWEEP:CFRQ?
response_prefix=;LOGINC
response_terminator=;
minimum=0.01
maximum=50
visible_when=sweep_type:LOG

[sweep_time]
type=number
quantity=time
label=Step Time
base_unit=s
set=SWEEP:CFRQ:TIME {value}S
query=SWEEP:CFRQ?
response_prefix=;TIME
response_unit=ms
minimum=0.05
maximum=10

[sweep_mode]
type=select
label=Sweep Mode
set=SWEEP:MODE {value}
query=SWEEP?
response_prefix=:SWEEP:MODE
response_terminator=;
options=Single:SNGL,Continuous:CONT

[sweep_type]
type=select
label=Sweep Type
set=SWEEP:TYPE {value}
query=SWEEP?
response_prefix=;TYPE
response_terminator=;
options=Linear:LIN,Logarithmic:LOG

[sweep_trigger]
type=select
label=Sweep Trigger
set=SWEEP:TRIG {value}
query=SWEEP?
response_prefix=;TRIG
response_terminator=;
options=Off:OFF,Start:START,Start-Stop:STARTSTOP,Step:STEP


[sweep_start_action]
type=toggle_action
label=Start Sweep
label_on=Stop Sweep
action=SWEEP:GO
action_on=SWEEP:HALT

[sweep_reset_action]
type=action
label=Reset Sweep
action=SWEEP:RESET
resets_toggle=sweep_start_action

