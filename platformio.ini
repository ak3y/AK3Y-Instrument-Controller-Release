;==========================================================
;
;  AK3Y Instrument Controller
;
;  PlatformIO Configuration
;
;==========================================================

[env:esp32dev]

platform = espressif32

board = esp32dev

framework = arduino

monitor_speed = 115200
monitor_echo = yes

upload_speed = 921600

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -I include

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
 